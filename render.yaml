services:
  - type: web
    name: quickshare-app
    env: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: STORAGE_DRIVER
        value: local
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
